<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#071d14">
<title>Forgot Password — Copacetic Co.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="admin.css">
<style>
.password-login { background:radial-gradient(1000px 600px at 85% 0%,#143a27,transparent 65%),#071d14;color:#f1eadb; }
.password-card { position:relative;overflow:hidden;background:linear-gradient(180deg,#0b2b1d,#071d14);border:1px solid #c9a665;color:#f1eadb; }
.password-card::before { content:"";position:absolute;inset:0 0 auto;height:8px;background:repeating-linear-gradient(135deg,#c9a665 0 12px,#f1eadb 12px 24px,#9a5548 24px 36px,#f1eadb 36px 48px); }
.password-card h1,.password-card label { color:#f1eadb; }
.password-card h1 em { color:#c9a665; }
.password-card input { background:#050706;border-color:#c9a66588;color:#f1eadb; }
.password-card input:focus { border-color:#c9a665; }
.password-card .btn { background:#c9a665;color:#071d14; }
.password-card .btn:hover { background:#d8b979; }
.password-card .back-link { color:#c9a665; }
.password-message { margin:0;color:#f1eadb;line-height:1.55; }
.password-error { color:#ffb4a9; }
.password-card [hidden] { display:none; }
</style>
</head>
<body>
<header class="nav"><a class="brand" href="/">COPACETIC <span>CO.</span></a><nav id="primary-navigation"><a href="/">Home</a><a href="/#services">Services</a><a href="/#story">Story</a><a href="/#work">Work</a><a href="/my-bookings.html">My Bookings</a></nav><a class="btn small" href="/booking.html">Book Now</a><button class="nav-toggle" type="button" aria-controls="primary-navigation" aria-expanded="false" aria-label="Open navigation"><span></span><span></span><span></span></button></header>
<main>
  <section class="admin-login password-login">
    <div class="login-card password-card">
      <img src="assets/logo.jpeg" alt="Copacetic Co. logo">
      <h1>Forgot <em>password?</em></h1>
      <form id="forgotPasswordForm">
        <label>Email<input id="resetEmail" type="email" autocomplete="email" required></label>
        <p id="resetMessage" class="password-message" role="status" aria-live="polite" hidden></p>
        <p id="resetError" class="login-error password-error" role="alert"></p>
        <button class="btn" type="submit">Send Reset Link</button>
      </form>
      <a class="back-link" href="/my-bookings.html">← Back to sign in</a>
    </div>
  </section>
</main>
<script src="script.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="my-bookings.js"></script>
<script>
const forgotForm=document.getElementById('forgotPasswordForm');
const resetEmail=document.getElementById('resetEmail');
const resetMessage=document.getElementById('resetMessage');
const resetError=document.getElementById('resetError');

forgotForm.addEventListener('submit',async(event)=>{
  event.preventDefault();
  resetError.textContent='';
  resetMessage.hidden=true;
  const submitButton=forgotForm.querySelector('button[type="submit"]');
  submitButton.disabled=true;
  try{
    const {error}=await window.copaceticSupabase.auth.resetPasswordForEmail(resetEmail.value.trim(),{
      redirectTo:new URL('/reset-password.html',window.location.href).href
    });
    if(error) throw error;
    resetMessage.textContent='If an account exists for that email, reset instructions are on their way. Please check your inbox.';
    resetMessage.hidden=false;
    forgotForm.querySelector('label').hidden=true;
    submitButton.hidden=true;
  }catch(error){
    resetError.textContent='We could not send reset instructions. Please try again.';
  }finally{
    submitButton.disabled=false;
  }
});
</script>
</body>
</html>
