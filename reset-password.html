<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#071d14">
<title>Reset Password — Copacetic Co.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="admin.css">
<style>
.password-login { background:radial-gradient(1000px 600px at 85% 0%,#143a27,transparent 65%),#071d14;color:#f1eadb; }
.password-card { position:relative;overflow:hidden;background:linear-gradient(180deg,#0b2b1d,#071d14);border:1px solid #c9a665;color:#f1eadb; }
.password-card::before { content:"";position:absolute;inset:0 0 auto;height:8px;background:repeating-linear-gradient(135deg,#c9a665 0 12px,#f1eadb 12px 24px,#9a5548 24px 36px,#f1eadb 36px 48px); }
.password-card h1,.password-card label { color:#f1eadb; }
.password-card h1 em { color:#c9a665; }
.password-card input { background:#050706;border-color:#c9a66588;color:#f1eadb; }
.password-card input:focus { border-color:#c9a665; }
.password-card .btn { background:#c9a665;color:#071d14; }
.password-card .btn:hover { background:#d8b979; }
.password-card .back-link { color:#c9a665; }
.password-message { margin:0;color:#f1eadb;line-height:1.55; }
.password-error { color:#ffb4a9; }
.password-card [hidden] { display:none; }
</style>
</head>
<body>
<header class="nav"><a class="brand" href="/">COPACETIC <span>CO.</span></a><nav id="primary-navigation"><a href="/">Home</a><a href="/#services">Services</a><a href="/#story">Story</a><a href="/#work">Work</a><a href="/my-bookings.html">My Bookings</a></nav><a class="btn small" href="/booking.html">Book Now</a><button class="nav-toggle" type="button" aria-controls="primary-navigation" aria-expanded="false" aria-label="Open navigation"><span></span><span></span><span></span></button></header>
<main>
  <section class="admin-login password-login">
    <div class="login-card password-card">
      <img src="assets/logo.jpeg" alt="Copacetic Co. logo">
      <h1>Reset <em>password.</em></h1>
      <form id="newPasswordForm">
        <label>New password<input id="newPassword" type="password" autocomplete="new-password" minlength="6" required></label>
        <label>Confirm password<input id="confirmPassword" type="password" autocomplete="new-password" minlength="6" required></label>
        <p id="resetMessage" class="password-message" role="status" aria-live="polite" hidden></p>
        <p id="resetError" class="login-error password-error" role="alert"></p>
        <button class="btn" type="submit">Update Password</button>
      </form>
      <a id="loginLink" class="back-link" href="/my-bookings.html">← Back to sign in</a>
    </div>
  </section>
</main>
<script src="script.js"></script>
<script>window.copaceticRecoveryParams=new URLSearchParams(window.location.hash.slice(1));</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="my-bookings.js"></script>
<script>
const newPasswordForm=document.getElementById('newPasswordForm');
const newPassword=document.getElementById('newPassword');
const confirmPassword=document.getElementById('confirmPassword');
const resetMessage=document.getElementById('resetMessage');
const resetError=document.getElementById('resetError');
const recoveryParams=window.copaceticRecoveryParams;
const accessToken=recoveryParams.get('access_token');
const refreshToken=recoveryParams.get('refresh_token');
const recoveryType=recoveryParams.get('type');
const submitButton=newPasswordForm.querySelector('button[type="submit"]');

if(!accessToken||!refreshToken||recoveryType!=='recovery'){
  resetError.textContent='This reset link is invalid or has expired. Request a new one to continue.';
  submitButton.disabled=true;
}

newPasswordForm.addEventListener('submit',async(event)=>{
  event.preventDefault();
  resetError.textContent='';
  if(newPassword.value!==confirmPassword.value){
    resetError.textContent='Passwords do not match.';
    confirmPassword.focus();
    return;
  }
  submitButton.disabled=true;
  try{
    const {error:sessionError}=await window.copaceticSupabase.auth.setSession({
      access_token:accessToken,
      refresh_token:refreshToken
    });
    if(sessionError) throw sessionError;
    const {error}=await window.copaceticSupabase.auth.updateUser({password:newPassword.value});
    if(error) throw error;
    const {error:signOutError}=await window.copaceticSupabase.auth.signOut();
    resetMessage.textContent='Your password has been updated. You can now sign in.';
    resetMessage.hidden=false;
    if(signOutError) resetError.textContent='Your password was updated, but this session could not be signed out automatically.';
    newPasswordForm.querySelectorAll('label,button').forEach((element)=>{element.hidden=true;});
    document.getElementById('loginLink').textContent='Go to sign in →';
  }catch(error){
    resetError.textContent='We could not update your password. The reset link may have expired; request a new one and try again.';
  }finally{
    submitButton.disabled=false;
  }
});
</script>
</body>
</html>
